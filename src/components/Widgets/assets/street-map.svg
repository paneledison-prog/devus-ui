      <path d="M415,-30 L415,1230" stroke-width="16"/>

      <!-- Major East-West Crosstown Artery -->
      <path d="M-30,650 L830,665" stroke-width="17"/>
    </g>

    <!-- Roundabouts & Intersections -->
    <g fill="#ffffff">
